<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Dành Riêng Cho Bạn</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --text-color: #fdf2f8;
            --card-bg: rgba(20, 20, 20, 0.75);
            --primary-btn: #f472b6;
            --primary-btn-hover: #ec4899;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.8s ease-in-out;
        }

        .btn-custom {
            background-color: var(--primary-btn);
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-custom:hover {
            background-color: var(--primary-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.4);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .hidden-screen {
            display: none !important;
        }

        /* --- CSS ĐỒ HỌA HOA NỞ 3D HOÀN CHỈNH --- */
        .flower-scene {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .night {
            position: fixed;
            left: 0; top: 0; width: 100%; height: 100%;
            background-image: radial-gradient(ellipse at bottom, rgba(16, 20, 40, 0.8) 0%, rgba(5, 5, 10, 0.95) 100%);
        }

        .happy-woman-day {
            position: absolute;
            top: 6vh;
            width: 100%;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: #ffb6c1;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6);
            z-index: 2;
        }

        .flowers {
            position: relative;
            transform: scale(0.65);
            bottom: -15vh;
            display: flex;
            justify-content: center;
        }

        .flower {
            position: absolute;
            bottom: 10vh;
            transform-origin: bottom center;
            z-index: 10;
        }

        .flower--1 { animation: moving-flower-1 4s linear infinite; }
        .flower--2 { left: 50%; transform: rotate(20deg); animation: moving-flower-2 4s linear infinite; }
        .flower--3 { left: -50%; transform: rotate(-15deg); animation: moving-flower-3 4s linear infinite; }

        .flower__leafs {
            position: relative;
            width: 55px;
            height: 55px;
            animation: blooming-flower 2s 1s backwards;
        }

        .flower__leaf {
            position: absolute;
            bottom: 0; left: 0;
            width: 55px; height: 55px;
            border-radius: 51% 49% 47% 53% / 44% 45% 55% 56%;
            background-image: linear-gradient(to top, #ff758c, #ff7eb3);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.4);
            transform-origin: bottom center;
        }

        .flower__leaf--1 { transform: translate(-10%, 1vw) rotate(-40deg); }
        .flower__leaf--2 { transform: translate(10%, 1vw) rotate(40deg); }
        .flower__leaf--3 { transform: translate(-20%, -1vw) rotate(-80deg); }
        .flower__leaf--4 { transform: translate(20%, -1vw) rotate(80deg); }

        .flower__white-circle {
            position: absolute;
            left: -3.5px; top: -3.5px;
            width: 62px; height: 62px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px #ffeb3b;
        }

        .flower__line {
            height: 400px; width: 6px;
            background-image: linear-gradient(to top, rgba(0,0,0,0.5), #0f5132, #2e7d32);
            border-radius: 4px;
            margin: 0 auto;
        }

        @keyframes blooming-flower {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes moving-flower-1 {
            0%, 100% { transform: rotate(2deg); }
            50% { transform: rotate(-2deg); }
        }
        @keyframes moving-flower-2 {
            0%, 100% { transform: rotate(18deg); }
            50% { transform: rotate(22deg); }
        }
        @keyframes moving-flower-3 {
            0%, 100% { transform: rotate(-13deg); }
            50% { transform: rotate(-17deg); }
        }
    </style>
</head>
<body class="relative">

    <!-- HIỆU ỨNG HOA NỞ 3D (ĐẶT LÀM NỀN) -->
    <div class="flower-scene">
        <div class="night"></div>
        <div class="happy-woman-day">𝓗𝓪𝓹𝓹𝔂 𝔀𝓸𝓶𝓮𝓷'𝓼 𝓭𝓪𝔂 2️⃣0️⃣/1️⃣0️⃣</div>
        <div class="flowers">
            <div class="flower flower--1">
                <div class="flower__leafs">
                    <div class="flower__leaf flower__leaf--1"></div>
                    <div class="flower__leaf flower__leaf--2"></div>
                    <div class="flower__leaf flower__leaf--3"></div>
                    <div class="flower__leaf flower__leaf--4"></div>
                    <div class="flower__white-circle"></div>
                </div>
                <div class="flower__line"></div>
            </div>
            <div class="flower flower--2">
                <div class="flower__leafs">
                    <div class="flower__leaf flower__leaf--1"></div>
                    <div class="flower__leaf flower__leaf--2"></div>
                    <div class="flower__leaf flower__leaf--3"></div>
                    <div class="flower__leaf flower__leaf--4"></div>
                    <div class="flower__white-circle"></div>
                </div>
                <div class="flower__line"></div>
            </div>
            <div class="flower flower--3">
                <div class="flower__leafs">
                    <div class="flower__leaf flower__leaf--1"></div>
                    <div class="flower__leaf flower__leaf--2"></div>
                    <div class="flower__leaf flower__leaf--3"></div>
                    <div class="flower__leaf flower__leaf--4"></div>
                    <div class="flower__white-circle"></div>
                </div>
                <div class="flower__line"></div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH NHẬP THÔNG TIN -->
    <div id="login-screen" class="screen z-10 transition-opacity duration-500">
        <div class="glass-card rounded-2xl p-8 md:p-10 w-full max-w-md text-center">
            <h1 class="font-cursive text-5xl mb-2 text-[#ffb6c1] drop-shadow-sm">Ngày Của Nàng</h1>
            <p class="text-sm opacity-80 mb-6">Nhập tên và ngày sinh để mở hộp quà lời chúc riêng biệt cho bạn.</p>
            
            <form id="info-form" class="space-y-4 text-left">
                <div>
                    <label for="userName" class="block text-xs uppercase font-semibold mb-1 tracking-wider">Tên của bạn:</label>
                    <input type="text" id="userName" required placeholder="Ví dụ: Thảo Vy..." 
                        class="w-full px-4 py-3 rounded-xl border border-white/20 focus:outline-none focus:ring-2 focus:ring-[var(--primary-btn)] bg-black/40 text-white placeholder-gray-500">
                </div>
                
                <div>
                    <label for="userDob" class="block text-xs uppercase font-semibold mb-1 tracking-wider">Ngày sinh của bạn:</label>
                    <input type="date" id="userDob" required 
                        class="w-full px-4 py-3 rounded-xl border border-white/20 focus:outline-none focus:ring-2 focus:ring-[var(--primary-btn)] bg-black/40 text-white">
                </div>
                
                <button type="submit" class="btn-custom w-full py-3 rounded-xl font-bold text-base mt-2 flex items-center justify-center gap-2">
                    <span>Mở Lời Chúc 20/10</span>
                    <i class="fas fa-gift"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH HIỂN THỊ LỜI CHÚC -->
    <div id="result-screen" class="screen z-10 hidden-screen opacity-0 transition-opacity duration-1000">
        <div class="glass-card rounded-3xl p-8 md:p-12 w-full max-w-xl text-center relative">
            <h2 class="text-xs md:text-sm font-semibold uppercase tracking-widest text-pink-300 mb-2">Gửi Tặng 20/10</h2>
            <h1 id="greeting-name" class="font-cursive text-4xl md:text-6xl mb-6 text-pink-200">
                Gửi [Tên],
            </h1>
            
            <div class="relative py-4">
                <i class="fas fa-quote-left absolute top-0 left-0 text-2xl opacity-20"></i>
                <p id="greeting-message" class="text-base md:text-lg leading-relaxed italic z-10 relative px-6 text-gray-200">
                    [Nội dung lời chúc đa dạng sẽ xuất hiện ở đây...]
                </p>
                <i class="fas fa-quote-right absolute bottom-0 right-0 text-2xl opacity-20"></i>
            </div>
            
            <button id="btn-back" class="mt-8 underline text-xs font-semibold opacity-70 hover:opacity-100 transition-opacity text-pink-300">
                <i class="fas fa-undo-alt mr-1"></i> Nhập lại thông tin khác
            </button>
        </div>
    </div>

    <!-- TRÌNH PHÁT NHẠC NỀN -->
    <div class="fixed bottom-6 right-6 z-50 flex items-center gap-3">
        <span id="music-tooltip" class="text-xs bg-black/80 text-white px-2.5 py-1.5 rounded-lg shadow-md opacity-0 transition-opacity duration-300 pointer-events-none">Bật nhạc nền nhé!</span>
        <button id="music-toggle" class="w-12 h-12 rounded-full bg-black/60 border border-white/20 text-pink-300 flex items-center justify-center text-lg hover:scale-110 transition-transform duration-300 focus:outline-none">
            <i class="fas fa-music"></i>
        </button>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://cdn.freesound.org/previews/614/614881_11861866-lq.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Các nhóm lời chúc phong phú, hoàn toàn khác biệt theo từng phong cách
        const wishTemplates = [
            (name, dob) => `Nhân ngày Phụ nữ Việt Nam 20/10, chúc cô gái sinh ngày ${dob} - ${name} luôn giữ được nụ cười tươi tắn trên môi. Mong rằng tuổi mới và mỗi ngày trôi qua của bạn đều được lấp đầy bởi những điều ngọt ngào, may mắn và hạnh phúc viên mãn!`,
            (name, dob) => `Gửi ${name} (${dob})! Thế giới hôm nay rực rỡ hơn vì có sự hiện diện của những người phụ nữ tuyệt vời như bạn. Chúc bạn một ngày 20/10 ngập tràn hoa quà, luôn tự tin, kiêu hãnh và thành công rực rỡ trên con đường mình chọn.`,
            (name, dob) => `Chúc mừng 20/10 đến ${name}! Sinh vào ngày ${dob} chắc hẳn đã ban cho bạn một tính cách vừa dịu dàng lại vô cùng mạnh mẽ. Chúc bạn luôn an nhiên, trẻ trung, yêu đời và luôn được cưng chiều hết mực nhé!`,
            (name, dob) => `Hôm nay là 20/10 - ngày dành riêng cho một nửa thế giới và đặc biệt là dành cho ${name} (${dob}). Chúc bạn luôn xinh đẹp ngút ngàn, tiền tài rủng rỉnh, tình yêu thăng hoa và mọi dự định đều thành hiện thực!`
        ];

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        const loginScreen = document.getElementById('login-screen');
        const resultScreen = document.getElementById('result-screen');
        const infoForm = document.getElementById('info-form');
        const btnBack = document.getElementById('btn-back');
        const musicToggle = document.getElementById('music-toggle');
        const bgMusic = document.getElementById('bgMusic');
        const musicTooltip = document.getElementById('music-tooltip');
        
        let isMusicPlaying = false;

        infoForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nameInput = document.getElementById('userName').value.trim();
            const dobInput = document.getElementById('userDob').value;
            
            if (!nameInput || !dobInput) return;

            // Xử lý ngày sinh sang định dạng DD/MM/YYYY
            const parts = dobInput.split('-');
            const formattedDob = `${parts[2]}/${parts[1]}/${parts[0]}`;
            
            const firstName = nameInput.split(' ').pop();
            document.getElementById('greeting-name').innerText = `Gửi ${firstName},`;
            
            // Chọn ngẫu nhiên một lời chúc từ danh sách đa dạng
            const selectedWishFunc = getRandomItem(wishTemplates);
            document.getElementById('greeting-message').innerText = selectedWishFunc(nameInput, formattedDob);

            if (!isMusicPlaying) {
                toggleMusic();
            }

            loginScreen.style.opacity = '0';
            setTimeout(() => {
                loginScreen.classList.add('hidden-screen');
                resultScreen.classList.remove('hidden-screen');
                void resultScreen.offsetWidth; 
                resultScreen.style.opacity = '1';
            }, 500);
        });

        btnBack.addEventListener('click', () => {
            resultScreen.style.opacity = '0';
            setTimeout(() => {
                resultScreen.classList.add('hidden-screen');
                loginScreen.classList.remove('hidden-screen');
                void loginScreen.offsetWidth;
                loginScreen.style.opacity = '1';
            }, 500);
        });

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicToggle.innerHTML = '<i class="fas fa-music"></i>';
                musicToggle.style.color = '#ffb6c1';
            } else {
                bgMusic.play().catch(() => {});
                musicToggle.innerHTML = '<i class="fas fa-pause"></i>';
                musicToggle.style.color = '#34d399'; 
            }
            isMusicPlaying = !isMusicPlaying;
        }

        musicToggle.addEventListener('click', toggleMusic);

        setTimeout(() => {
            if (!isMusicPlaying) {
                musicTooltip.style.opacity = '1';
                setTimeout(() => { musicTooltip.style.opacity = '0'; }, 4000);
            }
        }, 2000);
    </script>
</body>
</html>
