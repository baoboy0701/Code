<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Dành Riêng Cho Bạn</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b192c;
            --text-color: #f0f4f8;
            --card-bg: rgba(16, 37, 66, 0.82);
            --primary-btn: #38bdf8;
            --primary-btn-hover: #0ea5e9;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.8s ease-in-out;
        }

        .btn-custom {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-custom:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .hidden-screen {
            display: none !important;
        }

        /* --- CSS HIỆU ỨNG HOA HỒNG NỞ RỘ TRÊN NỀN XANH DƯƠNG --- */
        .flower-scene {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .night {
            position: fixed;
            left: 0; top: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 50% 30%, rgba(30, 58, 138, 0.6) 0%, rgba(11, 25, 44, 0.98) 100%);
        }

        .happy-woman-day {
            position: absolute;
            top: 5vh;
            width: 100%;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: #7dd3fc;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(125, 211, 252, 0.5);
            z-index: 2;
        }

        .flowers {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%) scale(0.65);
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .flower {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            z-index: 10;
        }

        .flower--1 { animation: moving-flower-1 4s linear infinite; }
        .flower--2 { left: 140px; transform: rotate(18deg); animation: moving-flower-2 4s linear infinite; }
        .flower--3 { left: -140px; transform: rotate(-15deg); animation: moving-flower-3 4s linear infinite; }

        .flower__leafs {
            position: relative;
            width: 70px;
            height: 70px;
            animation: blooming-flower 2.2s 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        .flower__leaf {
            position: absolute;
            bottom: 0; left: 0;
            width: 55px; height: 55px;
            border-radius: 50% 50% 30% 70% / 50% 60% 40% 50%;
            background-image: linear-gradient(135deg, #ff4d6d, #ff758c, #ff8fa3);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.4), 0 2px 8px rgba(255, 77, 109, 0.3);
            transform-origin: bottom center;
        }

        .flower__leaf--1 { transform: translate(-15%, 5px) rotate(-50deg); opacity: 0.95; }
        .flower__leaf--2 { transform: translate(15%, 5px) rotate(50deg); opacity: 0.95; }
        .flower__leaf--3 { transform: translate(-30%, -5px) rotate(-100deg); opacity: 0.9; }
        .flower__leaf--4 { transform: translate(30%, -5px) rotate(100deg); opacity: 0.9; }
        .flower__leaf--5 { transform: translate(0, -15px) rotate(0deg); background-image: linear-gradient(135deg, #ff758c, #ffb3c6); opacity: 0.95; }

        .flower__white-circle {
            position: absolute;
            left: 15px; top: 15px;
            width: 40px; height: 40px;
            background: radial-gradient(circle, #fff0f3, #ffccd5);
            border-radius: 50%;
            box-shadow: 0 0 12px #ff4d6d;
        }

        .flower__line {
            height: 280px; width: 6px;
            background-image: linear-gradient(to top, rgba(11,25,44,0.8), #1e3a8a, #0284c7);
            border-radius: 4px;
            margin: 0 auto;
        }

        @keyframes blooming-flower {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes moving-flower-1 {
            0%, 100% { transform: rotate(2deg); }
            50% { transform: rotate(-2deg); }
        }
        @keyframes moving-flower-2 {
            0%, 100% { transform: rotate(16deg); }
            50% { transform: rotate(20deg); }
        }
        @keyframes moving-flower-3 {
            0%, 100% { transform: rotate(-13deg); }
            50% { transform: rotate(-17deg); }
        }
    </style>
</head>
<body class="relative">

    <!-- HOA HỒNG NỞ RỘ TRÊN PHÔNG NỀN XANH DƯƠNG -->
    <div class="flower-scene">
        <div class="night"></div>
        <div class="happy-woman-day">𝓗𝓪𝓹𝓹𝔂 𝔀𝓸𝓶𝓮𝓷'𝓼 𝓭𝓪𝔂 2️⃣0️⃣/1️⃣0️⃣</div>
        <div class="flowers">
            <div class="flower flower--1">
                <div class="flower__leafs">
                    <div class="flower__leaf flower__leaf--1"></div>
                    <div class="flower__leaf flower__leaf--2"></div>
                    <div class="flower__leaf flower__leaf--3"></div>
                    <div class="flower__leaf flower__leaf--4"></div>
                    <div class="flower__leaf flower__leaf--5"></div>
                    <div class="flower__white-circle"></div>
                </div>
                <div class="flower__line"></div>
            </div>
            <div class="flower flower--2">
                <div class="flower__leafs">
                    <div class="flower__leaf flower__leaf--1"></div>
                    <div class="flower__leaf flower__leaf--2"></div>
                    <div class="flower__leaf flower__leaf--3"></div>
                    <div class="flower__leaf flower__leaf--4"></div>
                    <div class="flower__leaf flower__leaf--5"></div>
                    <div class="flower__white-circle"></div>
                </div>
                <div class="flower__line"></div>
            </div>
            <div class="flower flower--3">
                <div class="flower__leafs">
                    <div class="flower__leaf flower__leaf--1"></div>
                    <div class="flower__leaf flower__leaf--2"></div>
                    <div class="flower__leaf flower__leaf--3"></div>
                    <div class="flower__leaf flower__leaf--4"></div>
                    <div class="flower__leaf flower__leaf--5"></div>
                    <div class="flower__white-circle"></div>
                </div>
                <div class="flower__line"></div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH NHẬP THÔNG TIN -->
    <div id="login-screen" class="screen z-10 transition-opacity duration-500">
        <div class="glass-card rounded-2xl p-8 md:p-10 w-full max-w-md text-center">
            <h1 class="font-cursive text-5xl mb-2 text-sky-300 drop-shadow-sm">Gửi Gắm Yêu Thương</h1>
            <p class="text-sm text-slate-300 mb-6">Nhập tên và ngày sinh để mở lời chúc ý nghĩa nhất.</p>
            
            <form id="info-form" class="space-y-4 text-left">
                <div>
                    <label for="userName" class="block text-xs uppercase font-semibold text-sky-200 mb-1 tracking-wider">Họ và tên người nhận:</label>
                    <input type="text" id="userName" required placeholder="Ví dụ: Đặng Thị Phương Duy..." 
                        class="w-full px-4 py-3 rounded-xl border border-sky-500/30 focus:outline-none focus:ring-2 focus:ring-sky-400 bg-slate-900/60 text-white placeholder-slate-500">
                </div>
                
                <div>
                    <label for="userDob" class="block text-xs uppercase font-semibold text-sky-200 mb-1 tracking-wider">Ngày sinh:</label>
                    <input type="date" id="userDob" required 
                        class="w-full px-4 py-3 rounded-xl border border-sky-500/30 focus:outline-none focus:ring-2 focus:ring-sky-400 bg-slate-900/60 text-white">
                </div>
                
                <button type="submit" class="btn-custom w-full py-3 rounded-xl font-bold text-base mt-2 flex items-center justify-center gap-2">
                    <span>Mở Lời Chúc 20/10</span>
                    <i class="fas fa-gift"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH HIỂN THỊ KẾT QUẢ -->
    <div id="result-screen" class="screen z-10 hidden-screen opacity-0 transition-opacity duration-1000">
        <div class="glass-card rounded-3xl p-8 md:p-12 w-full max-w-xl text-center relative">
            <h2 id="recipient-title" class="text-xs md:text-sm font-semibold uppercase tracking-widest text-sky-300 mb-2">Trân Trọng Gửi Tặng</h2>
            <h1 id="greeting-name" class="font-cursive text-4xl md:text-6xl mb-6 text-sky-200">
                [Tên]
            </h1>
            
            <div class="relative py-4">
                <i class="fas fa-quote-left absolute top-0 left-0 text-2xl opacity-20 text-sky-300"></i>
                <p id="greeting-message" class="text-base md:text-lg leading-relaxed italic z-10 relative px-6 text-slate-100">
                    [Lời chúc giàu cảm xúc sẽ hiển thị ở đây...]
                </p>
                <i class="fas fa-quote-right absolute bottom-0 right-0 text-2xl opacity-20 text-sky-300"></i>
            </div>
            
            <button id="btn-back" class="mt-8 underline text-xs font-semibold opacity-80 hover:opacity-100 transition-opacity text-sky-300">
                <i class="fas fa-undo-alt mr-1"></i> Nhập lại thông tin khác
            </button>
        </div>
    </div>

    <!-- BỘ ĐIỀU KHIỂN NHẠC NỀN ĐA DẠNG -->
    <div class="fixed bottom-6 right-6 z-50 flex items-center gap-3">
        <span id="music-tooltip" class="text-xs bg-slate-900/90 border border-sky-500/30 text-sky-200 px-3 py-2 rounded-xl shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none">Chọn bản nhạc 20/10 yêu thích nhé!</span>
        
        <!-- Nút chuyển bài hát -->
        <button id="next-song" title="Đổi bài hát tiếp theo" class="w-10 h-10 rounded-full bg-slate-900/80 border border-sky-500/30 text-sky-300 flex items-center justify-center text-sm hover:scale-110 transition-transform duration-300 focus:outline-none">
            <i class="fas fa-forward"></i>
        </button>

        <!-- Nút Play/Pause -->
        <button id="music-toggle" title="Bật/Tắt nhạc" class="w-12 h-12 rounded-full bg-slate-900/80 border border-sky-500/40 text-sky-300 flex items-center justify-center text-lg hover:scale-110 transition-transform duration-300 focus:outline-none shadow-lg">
            <i class="fas fa-music"></i>
        </button>
    </div>

    <!-- Danh sách các bài hát lãng mạn thích hợp nghe ngày 20/10 -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.freesound.org/previews/614/614881_11861866-lq.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Kho tàng bài hát lãng mạn (dùng link âm thanh chất lượng từ freesound/audio cdn)
        const playlist = [
            { src: "https://cdn.freesound.org/previews/614/614881_11861866-lq.mp3", title: "Bản tình ca nhẹ nhàng" },
            { src: "https://cdn.freesound.org/previews/567/567943_5121236-lq.mp3", title: "Giai điệu du dương 20/10" },
            { src: "https://cdn.freesound.org/previews/608/608304_11861866-lq.mp3", title: "Khúc ca ngọt ngào" }
        ];
        let currentSongIndex = 0;

        // Kho tàng lời chúc phong phú theo độ tuổi
        const wishBankMature = [
            (name) => `Nhân ngày Phụ nữ Việt Nam 20/10, xin gửi đến ${name} những lời chúc tốt đẹp và trân trọng nhất. Chúc luôn dồi dào sức khỏe, bình an trong tâm hồn và mãi giữ được nụ cười rạng rỡ, viên mãn bên gia đình yêu thương.`,
            (name) => `Kính chúc ${name} một ngày 20/10 thật nhiều niềm vui và hạnh phúc. Mong rằng những chặng đường phía trước luôn tràn ngập ánh ủi, may mắn, sự an yên và gặt hái được thật nhiều trái ngọt trong cuộc sống.`
        ];

        const wishBankMiddle = [
            (name) => `Nhân ngày 20/10, chúc ${name} luôn giữ vững mái ấm hạnh phúc, sự nghiệp rạng rỡ và lúc nào cũng tràn đầy năng lượng tích cực. Mong mọi dự định của bạn đều thành hiện thực và luôn được yêu thương trọn vẹn.`,
            (name) => `Gửi ${name}, chúc bạn một ngày 20/10 ngập tràn hoa và những lời chúc ngọt ngào nhất. Cảm ơn sự chu đáo và tuyệt vời của bạn; chúc bạn luôn xinh đẹp, tự tin và thành công trên mọi con đường.`
        ];

        const wishBankYoung = [
            (name, dob) => `Nhân ngày 20/10, chúc cô gái sinh ngày ${dob} - ${name} luôn xinh đẹp, rạng rỡ như đóa hoa hồng buổi sớm. Mong rằng tuổi mới và mọi chặng đường sắp tới của bạn đều tràn ngập niềm vui, may mắn và tình yêu ngọt ngào!`,
            (name, dob) => `Thế giới hôm nay rực rỡ hơn vì có sự hiện diện của ${name} (${dob}). Chúc bạn một ngày 20/10 thật đáng nhớ, luôn tự tin bước đi và chinh phục mọi giấc mơ của chính mình nhé!`
        ];

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getFriendlyName(fullName) {
            const parts = fullName.trim().split(/\s+/);
            return parts[parts.length - 1];
        }

        const loginScreen = document.getElementById('login-screen');
        const resultScreen = document.getElementById('result-screen');
        const infoForm = document.getElementById('info-form');
        const btnBack = document.getElementById('btn-back');
        const musicToggle = document.getElementById('music-toggle');
        const nextSongBtn = document.getElementById('next-song');
        const bgMusic = document.getElementById('bgMusic');
        const musicTooltip = document.getElementById('music-tooltip');
        
        let isMusicPlaying = false;

        infoForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nameInput = document.getElementById('userName').value.trim();
            const dobInput = document.getElementById('userDob').value;
            
            if (!nameInput || !dobInput) return;

            // KIỂM TRA ĐẶC BIỆT DÀNH RIÊNG CHO TÊN: Đặng Thị Phương Duy
            const normalizedInputName = nameInput.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
            const targetName = "dang thi phuong duy";

            let message = "";
            let titleText = "";
            let displayName = "";

            if (normalizedInputName === targetName) {
                // Lời chúc từ người yêu vô cùng ngọt ngào, đặc biệt dành riêng cho Phương Duy
                titleText = "Gửi Người Con Gái Anh Yêu ❤️";
                displayName = "Phương Duy yêu dấu,";
                const parts = dobInput.split('-');
                const formattedDob = `${parts[2]}/${parts[1]}/${parts[0]}`;
                message = `Hôm nay 20/10, ngày dành riêng cho thế giới của những điều tuyệt vời nhất, và với anh, thế giới đó thu nhỏ lại chính là em - cô gái sinh ngày ${formattedDob} của đời anh. Cảm ơn em đã đến mang theo bao dịu dàng và ánh sáng cho cuộc đời anh. Chúc công chúa của anh luôn xinh đẹp, bình an, mọi mong ước đều thành hiện thực và hãy cứ tựa vai anh, phần còn lại cứ để anh lo! Yêu em thật nhiều!`;
            } else {
                const parts = dobInput.split('-'); // YYYY-MM-DD
                const year = parseInt(parts[0], 10);
                const currentYear = new Date().getFullYear();
                const age = currentYear - year;
                const formattedDob = `${parts[2]}/${parts[1]}/${parts[0]}`;

                if (age >= 45) {
                    titleText = "Trân Trọng Gửi Tặng 20/10";
                    displayName = nameInput;
                    const selectedFunc = getRandomItem(wishBankMature);
                    message = selectedFunc(nameInput);
                } else if (age >= 28) {
                    titleText = "Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10";
                    displayName = nameInput;
                    const selectedFunc = getRandomItem(wishBankMiddle);
                    message = selectedFunc(nameInput);
                } else {
                    titleText = "Gửi Tặng 20/10";
                    const shortName = getFriendlyName(nameInput);
                    displayName = `Gửi ${shortName},`;
                    const selectedFunc = getRandomItem(wishBankYoung);
                    message = selectedFunc(nameInput, formattedDob);
                }
            }

            document.getElementById('recipient-title').innerText = titleText;
            document.getElementById('greeting-name').innerText = displayName;
            document.getElementById('greeting-message').innerText = message;

            if (!isMusicPlaying) {
                toggleMusic();
            }

            loginScreen.style.opacity = '0';
            setTimeout(() => {
                loginScreen.classList.add('hidden-screen');
                resultScreen.classList.remove('hidden-screen');
                void resultScreen.offsetWidth; 
                resultScreen.style.opacity = '1';
            }, 500);
        });

        btnBack.addEventListener('click', () => {
            resultScreen.style.opacity = '0';
            setTimeout(() => {
                resultScreen.classList.add('hidden-screen');
                loginScreen.classList.remove('hidden-screen');
                void loginScreen.offsetWidth;
                loginScreen.style.opacity = '1';
            }, 500);
        });

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicToggle.innerHTML = '<i class="fas fa-music"></i>';
                musicToggle.style.color = '#7dd3fc';
            } else {
                bgMusic.play().catch(() => {});
                musicToggle.innerHTML = '<i class="fas fa-pause"></i>';
                musicToggle.style.color = '#34d399'; 
            }
            isMusicPlaying = !isMusicPlaying;
        }

        musicToggle.addEventListener('click', toggleMusic);

        nextSongBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            bgMusic.src = playlist[currentSongIndex].src;
            bgMusic.play().catch(() => {});
            isMusicPlaying = true;
            musicToggle.innerHTML = '<i class="fas fa-pause"></i>';
            musicToggle.style.color = '#34d399';
            
            // Hiển thị tooltip tên bài hát tạm thời
            musicTooltip.innerText = `Đang phát: ${playlist[currentSongIndex].title}`;
            musicTooltip.style.opacity = '1';
            setTimeout(() => { musicTooltip.style.opacity = '0'; }, 3000);
        });

        setTimeout(() => {
            if (!isMusicPlaying) {
                musicTooltip.innerText = "Bật nhạc nền 20/10 nhẹ nhàng nhé!";
                musicTooltip.style.opacity = '1';
                setTimeout(() => { musicTooltip.style.opacity = '0'; }, 4000);
            }
        }, 2000);
    </script>
</body>
</html>
